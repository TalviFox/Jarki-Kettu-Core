type: vertical-stack
cards:
  - type: thermostat
    entity: climate.YOUR_THERMOSTAT
    
  - type: entities
    title: Dynamic Auto-Switcher
    entities:
      - entity: input_boolean.hvac_auto_mode_director_enable
        name: Enable Coast Zone Logic
      - entity: input_select.hvac_heat_system_type
      - entity: input_number.hvac_target_heat_temp
      - entity: input_number.hvac_target_cool_temp
      - entity: sensor.house_temperature_average
        name: Current House Average
        icon: mdi:home-thermometer

  - type: markdown
    content: >-
      {%- set heat = states('input_number.hvac_target_heat_temp') | float(68) -%}
      {%- set cool = states('input_number.hvac_target_cool_temp') | float(72) -%}
      {%- set raw_current = states('sensor.house_temperature_average') -%}
      {%- set current = raw_current | float('unavailable') if raw_current not in ['unknown', 'unavailable'] else 'unavailable' -%}
      {%- set heat_on = heat - 1.0 -%}
      {%- set heat_off = heat + 0.5 -%}
      {%- set cool_on = cool + 2.0 -%}
      {%- set cool_off = cool -%}
      {%- set mode = states('sensor.dynamic_smart_mode_demand') -%}
      
      **Active Coast Zone:** 
      The system will rest while the house average is between **{{ heat_on | round(1) }}°F** and **{{ cool_on | round(1) }}°F**.
      
      {% if current == 'unavailable' %}
        ⏳ *Awaiting sensor data...*
      {% elif mode == 'cool' %}
        ❄️ **Cooling Active:** Driving house average down to {{ cool_off | round(1) }}°F.
      {% elif mode == 'heat' %}
        🔥 **Heating Active:** Deep soaking house average up to {{ heat_off | round(1) }}°F.
      {% else %}
        ✅ **System Resting:** Current average is **{{ current | round(1) }}°F**.
        *(Naturally drifting within target deadband)*
      {% endif %}